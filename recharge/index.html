<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Pe - Mobile Recharge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f1fa;
      color: #2b2b3a;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #5f259f, #8a4fd1);
      color: #fff;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; }
    header a { color: #fff; text-decoration: none; font-size: 0.95rem; }
    main { max-width: 480px; margin: 30px auto; padding: 0 20px; }
    .box {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 6px 20px rgba(95, 37, 159, 0.12);
    }
    h2 { color: #5f259f; margin-bottom: 14px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: 2px solid #8a4fd1; border-color: transparent; }
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
    .plan {
      border: 2px solid #e3d9f2;
      border-radius: 10px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      transition: 0.2s;
    }
    .plan:hover { border-color: #8a4fd1; }
    .plan.selected { border-color: #5f259f; background: #f4f1fa; }
    .plan .price { font-weight: 700; color: #5f259f; font-size: 1.1rem; }
    .plan .info { font-size: 0.75rem; color: #666; margin-top: 4px; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: #5f259f;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4a1c7e; }
    .message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }
    .message.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    .message.error { display: block; background: #ffebee; color: #d32f2f; }
  </style>
</head>
<body>
  <header>
    <h1>Mobile Recharge</h1>
    <a href="index.html">&larr; Home</a>
  </header>

  <main>
    <div class="box">
      <h2>Recharge your number</h2>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" placeholder="10 digit mobile number" maxlength="10">

      <label for="operator">Operator</label>
      <select id="operator">
        <option value="">Select operator</option>
        <option>Jio</option>
        <option>Airtel</option>
        <option>Vi</option>
        <option>BSNL</option>
      </select>

      <label>Choose a Plan</label>
      <div class="plans" id="plans">
        <div class="plan" data-amount="199">
          <div class="price">₹199</div>
          <div class="info">1.5GB/day<br>28 days</div>
        </div>
        <div class="plan" data-amount="299">
          <div class="price">₹299</div>
          <div class="info">2GB/day<br>28 days</div>
        </div>
        <div class="plan" data-amount="599">
          <div class="price">₹599</div>
          <div class="info">2GB/day<br>84 days</div>
        </div>
      </div>

      <button id="rechargeBtn">Recharge Now</button>
      <div class="message" id="message"></div>
    </div>
  </main>

  <script>
    const plans = document.querySelectorAll(".plan");
    const message = document.getElementById("message");
    let selectedAmount = null;

    // highlight the chosen plan
    plans.forEach(function (plan) {
      plan.addEventListener("click", function () {
        plans.forEach(function (p) { p.classList.remove("selected"); });
        plan.classList.add("selected");
        selectedAmount = plan.dataset.amount;
      });
    });

    // practice only: no real recharge happens
    document.getElementById("rechargeBtn").addEventListener("click", function () {
      const mobile = document.getElementById("mobile").value.trim();
      const operator = document.getElementById("operator").value;

      if (!/^[6-9]\d{9}$/.test(mobile)) {
        showMessage("Please enter a valid 10 digit mobile number.", "error");
      } else if (!operator) {
        showMessage("Please select an operator.", "error");
      } else if (!selectedAmount) {
        showMessage("Please choose a plan.", "error");
      } else {
        showMessage("✅ ₹" + selectedAmount + " recharge on " + operator + " for " + mobile + " (demo only)", "ok");
      }
    });

    function showMessage(text, type) {
      message.className = "message " + type;
      message.textContent = text;
    }
  </script>
</body>
</html>
