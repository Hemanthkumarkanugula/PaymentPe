<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaymentPe - Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f1fa;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #5f259f, #8a4fd1);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            margin-bottom: 15px;
            font-size: 36px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            color: #5f259f;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to PaymentPe</h1>
        <p>Your digital payments application</p>
    </header>

    <main>
        <div class="modules">
            <a class="card" href="balance/">Balance</a>
            <a class="card" href="rent/">Rent Payment</a>
            <a class="card" href="recharge/">Mobile Recharge</a>
            <a class="card" href="dth/">DTH Recharge</a>
        </div>
    </main>
</body>
</html>
