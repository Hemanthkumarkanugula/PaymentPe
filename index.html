<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Pe - Welcome</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f1fa;
      color: #2b2b3a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(135deg, #5f259f, #8a4fd1);
      color: #fff;
      text-align: center;
      padding: 64px 20px 80px;
    }
    header h1 { font-size: 2.4rem; margin-bottom: 12px; }
    header p { font-size: 1.1rem; opacity: 0.9; max-width: 560px; margin: 0 auto; }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 28px;
      background: #fff;
      color: #5f259f;
      font-weight: 600;
      border-radius: 999px;
      text-decoration: none;
    }
    main {
      max-width: 900px;
      margin: -40px auto 40px;
      padding: 0 20px;
      width: 100%;
    }
