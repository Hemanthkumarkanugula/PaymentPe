<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Pe - Pay Rent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f1fa;
      color: #2b2b3a;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #5f259f, #8a4fd1);
      color: #fff;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; }
    header a { color: #fff; text-decoration: none; font-size: 0.95rem; }
    main { max-width: 480px; margin: 30px auto; padding: 0 20px; }
    form {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 6px 20px rgba(95, 37, 159, 0.12);
    }
    h2 { color: #5f259f; margin-bottom: 18px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 0.9rem; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: 2px solid #8a4fd1; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: #5f259f;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4a1c7e; }
    .summary {
      margin-top: 18px;
      padding: 12px 14px;
      background: #f4f1fa;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }
    .message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pay Rent</h1>
    <a href="index.html">&larr; Home</a>
  </header>

  <main>
    <form id="rentForm">
      <h2>Rent Payment</h2>

      <label for="landlord">Landlord Name</label>
      <input type="text" id="landlord" placeholder="Enter landlord name" required>

      <label for="account">Account Number / UPI ID</label>
      <input type="text" id="account" placeholder="Enter account or UPI ID" required>

      <label for="month">Rent for Month</label>
      <select id="month" required>
        <option value="">Select month</option>
        <option>January</option><option>February</option><option>March</option>
        <option>April</option><option>May</option><option>June</option>
        <option>July</option><option>August</option><option>September</option>
        <option>October</option><option>November</option><option>December</option>
      </select>

      <label for="rent">Rent Amount (₹)</label>
      <input type="number" id="rent" placeholder="e.g. 8000" min="1" required>

      <div class="summary">
        <span>Convenience fee (1%)</span>
        <span id="fee">₹ 0.00</span>
      </div>
      <div class="summary">
        <span><strong>Total to pay</strong></span>
        <span id="total"><strong>₹ 0.00</strong></span>
      </div>

      <button type="submit">Pay Rent</button>
      <div class="message" id="message"></div>
    </form>
  </main>

  <script>
    const rentInput = document.getElementById("rent");
    const feeEl = document.getElementById("fee");
    const totalEl = document.getElementById("total");
    const form = document.getElementById("rentForm");
    const message = document.getElementById("message");

    function format(n) {
      return "₹ " + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // update fee and total as the user types
    rentInput.addEventListener("input", function () {
      const rent = parseFloat(rentInput.value) || 0;
      const fee = rent * 0.01;
      feeEl.textContent = format(fee);
      totalEl.innerHTML = "<strong>" + format(rent + fee) + "</strong>";
    });

    // practice only: no real payment happens
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = document.getElementById("landlord").value;
      const month = document.getElementById("month").value;
      message.style.display = "block";
      message.textContent = "✅ " + month + " rent sent to " + name + " (demo only)";
    });
  </script>
</body>
</html>
